services:
  localstack:
    image: localstack/localstack:3
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3.dynamodb
      DEFAULT_REGION: us-east-1
    volumes:
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh
    healthcheck:
      test: ["CMD", "curl", "f", "http://localhost:4566/_localstack/health"]
    interval: 5s
    timeout: 3s
    retries: 10

  controller:
    image:
