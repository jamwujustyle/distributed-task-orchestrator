services:
  localstack:
    image: localstack/localstack:3
    container_name: localstack
    ports:
      - "4566:4566"
    environment:
      SERVICES: s3,dynamodb,lambda
      LAMBDA_RUNTIME_ENVIRONMENT_TIMEOUT: 30
      LAMBDA_INIT_USER: root
      DEBUG: 1
    volumes:
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh
      - lambda-bin:/app/bin
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "2m"
        max-file: "3"
  controller:
    build:
      context: .
    container_name: controller
    command: air -c .air.controller.toml
    ports:
      - "50051:50051"
    volumes:
      - lambda-bin:/app/bin
    environment:
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
    depends_on:
      localstack:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - bin/
            - .git/
            - tmp/
            - "**/*_test.go"
        - action: rebuild
          path: go.sum
        - action: rebuild
          path: go.mod

  worker:
    build:
      context: .
    container_name: worker
    command: air -c .air.worker.toml
    environment:
      AWS_ENDPOINT_URL: http://localstack:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
    depends_on:
      localstack:
        condition: service_healthy
      controller:
        condition: service_started
    develop:
      watch:
        - action: sync
          path: .
          target: /app
          ignore:
            - bin/
            - tmp/
            - .git/
            - "**/*_test.go"
        - action: rebuild
          path: go.mod
        - action: rebuild
          path: go.sum

volumes:
  lambda-bin:
