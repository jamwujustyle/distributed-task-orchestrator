apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: controller
  template:
    metadata:
      labels:
        app: controller
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
    spec:
      containers:
      - name: controller
        image: codebuddha/orchestrator:latest
        command: ["/app/bin/controller"]
        ports:
        - containerPort: 50051
        - containerPort: 9091
          name: metrics
        envFrom:
        - configMapRef:
            name: orchestrator-config
        - secretRef:
            name: aws-credentials