apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-deployment
spec:
  replicas: 3
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9091"
    spec:
      containers:
      - name: worker
        image: codebuddha/orchestrator:latest
        command: ["/app/bin/worker"]
        ports:
          - containerPort: 9091
            name: metrics

        envFrom:
        - configMapRef:
            name: orchestrator-config
        - secretRef:
            name: aws-credentials