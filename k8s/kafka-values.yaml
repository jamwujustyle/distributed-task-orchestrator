controller:
  replicaCount: 1
  overrideConfiguration:
    offsets.topic.replication.factor: 1
    transaction.state.log.replication.factor: 1
    transaction.state.log.min.isr: 1

zookeeper:
  enabled: false

kraftVersion: 0

persistence:
  enabled: false

image:
  repository: bitnamilegacy/kafka
  tag: "3.8.0"

listeners:
  client:
    protocol: PLAINTEXT
  interbroker:
    protocol: PLAINTEXT
  controller:
    protocol: PLAINTEXT

sasl:
  enabled: false