apiVersion: v1
kind: ConfigMap
metadata:
  name: localstack-init-config
data:
  init.sh: |
    #!/usr/bin/env bash

    set -euo pipefail

    REGION=us-east-1

    echo "Creating a new s3 bucket: tasks-bucket"
    awslocal s3api create-bucket --bucket tasks-bucket --region $REGION

    echo "Creating a new dynamodb: TaskTable"
    awslocal dynamodb create-table \
        --table-name TaskTable \
        --attribute-definitions AttributeName=ID,AttributeType=S \
        --key-schema AttributeName=ID,KeyType=HASH \
        --billing-mode PAY_PER_REQUEST \
        --region $REGION

    cd /app/lambda && zip task-executor.zip bootstrap
    echo "creating lambda function"
    awslocal lambda create-function \
        --function-name task-executor \
        --runtime go1.x \
        --handler bootstrap \
        --role arn:aws:iam::000000000000:role/lambda-role \
        --zip-file fileb:///app/lambda/task-executor.zip \
        --region $REGION

    echo "localstack initialized"
